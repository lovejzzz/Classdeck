# Copies the database to R2 every second, so a lost server loses at most a moment of work.
# The R2 keys come from /opt/questhand/.env.local (see questhand-backup.service).
dbs:
  - path: /opt/questhand/.data/questhand.db
    replicas:
      - type: s3
        bucket: ${R2_BUCKET}
        path: backup/questhand.db
        endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
        region: auto
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        retention: 720h
